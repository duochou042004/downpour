id: content-range-reversed
category: ranges
description: >
  `Content-Range: bytes 5-1/N`, where the first byte position is after the last. Arithmetic on this
  underflows if it is believed, so it must be rejected at parse time rather than producing a
  negative or enormous length.
references: ["RFC 9110 §14.4", "INVARIANTS.md#i-5"]

server:
  content: { size: 128KiB, seed: 23 }
  ranges: !literal-content-range { value: "bytes 5-1/131072" }

expect:
  final_state: completed
  file_renamed: true
  range_support: absent
