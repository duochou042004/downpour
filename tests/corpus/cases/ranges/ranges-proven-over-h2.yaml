id: ranges-proven-over-h2
category: ranges
description: >
  A conforming 206 over HTTP/2, to check that range proving does not depend on the HTTP/1.1 code
  path. Cleartext h2c, so ALPN is not involved (backlog B-8).
references: ["RFC 9113", "INVARIANTS.md#i-6"]

server:
  protocol: "http/2"
  content: { size: 256KiB, seed: 26 }
  ranges: supported
  etag: '"h2-v1"'

expect:
  final_state: completed
  file_renamed: true
  range_support: proven
  total_length: 256KiB
