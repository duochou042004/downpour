id: retry-after-is-honoured
category: connections
description: >
  The first request is answered 503 with `Retry-After: 1`, then the server serves normally. The
  engine must wait and retry rather than failing, and must honour the header rather than substituting
  its own back-off — shortening what a rate limiter asked for is how a rate limit becomes a ban.
  One second rather than thirty, because the case has to run in CI; the exact-honouring behaviour is
  pinned exhaustively by crates/downpour-http/tests/retry_policy.rs, which needs no network.
references: ["RFC 9110 §10.2.3", "docs/03-transfer-engine-spec.md §7"]

server:
  content: { size: 64KiB, seed: 103 }
  transient_status_failures: 1
  transient_status: 503
  transient_retry_after: "1"

expect:
  final_state: completed
  file_renamed: true
  # probe + the failed body + the retried body. Two would mean no retry happened.
  min_requests: 3
