id: a-transfer-that-always-dies-at-the-same-offset-is-not-renamed
category: connections
description: >
  A middlebox that kills any flow crossing one point in the representation. Every response is cut
  at the same absolute offset, so the workers whose ranges lie before it finish normally and the
  one whose range spans it can never get past it — its retry asks for the bytes starting at the
  offset and gets nothing at all.
  This is the failure that most resembles success. Most of the file is present and durable, the
  part file is byte-correct as far as it goes, and a `.dppart` that is 75% of the way there is
  exactly what tempts an engine into renaming what it has. It must not: I-4 is that the final name
  appears only after full coverage. Distinct from `repeated-resets-exhaust-the-budget`, where
  nothing ever completes and there is no partial success to be tempted by, and from
  `every-response-is-cut-at-the-same-length`, where every attempt advances and the transfer
  finishes — here the budget is finite and must actually run out.
references: ["docs/agent/INVARIANTS.md#i-4", "docs/03-transfer-engine-spec.md §7", "docs/09-testing-strategy.md §3.2"]

connections: 2

server:
  content: { size: 1MiB, seed: 150 }
  # Inside the second worker's grant, so the first worker's range completes and the second cannot.
  drop_at_offset: 768KiB

expect:
  final_state: failed
  error_kind: truncated_body
  file_renamed: false
