id: repeated-resets-exhaust-the-budget
category: connections
description: >
  Every body request is truncated, forever. The engine must give up after MAX_RETRIES rather than
  looping indefinitely, and must not give the final name to the short file it has. The mirror of
  `transient-reset-is-retried`: together they prove the budget is finite AND that it is spent, which
  neither case proves alone.
references: ["docs/03-transfer-engine-spec.md §7", "docs/03-transfer-engine-spec.md §9", "INVARIANTS.md#i-4"]

server:
  content: { size: 128KiB, seed: 102 }
  # More than MAX_RETRIES (5), so the budget can never outlast the server.
  transient_body_failures: 99

expect:
  final_state: failed
  error_kind: truncated_body
  file_renamed: false
