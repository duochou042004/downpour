id: keep-alive-is-declined-in-advance
category: connections
description: >
  The origin refuses to hold connections open and says so: every response carries
  `Connection: close`. Nothing here is broken — it is the one connection behaviour in this
  category that is entirely correct, and it is in the category because a client that ignores the
  header treats a normal origin as a faulty one.
  It is the opposite of `keep-alive-closed-after-one-request`, which closes exactly as silently
  and forces the client to *recover*. Announced in advance, there is nothing to recover from: a
  client that reads the header opens a new connection for each request and never sees an error,
  and a client that does not write into a closed socket and report a phantom reset. So this is the
  only connections case that asserts an upper bound on requests — the proof is not that the engine
  recovered, it is that it never needed to.
references: ["RFC 9110 §7.6.1", "docs/03-transfer-engine-spec.md §7", "docs/09-testing-strategy.md §3.2"]

connections: 2

server:
  content: { size: 512KiB, seed: 152 }
  always_connection_close: true

expect:
  final_state: completed
  file_renamed: true
  # Every request needed its own connection.
  max_requests_per_connection: 1
  min_connections: 3
  # Probe plus one request per worker, and not one more. A retry would mean the engine wrote into
  # a socket the origin had already told it was closing.
  max_requests: 3
