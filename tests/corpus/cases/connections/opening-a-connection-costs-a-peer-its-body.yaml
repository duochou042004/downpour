id: opening-a-connection-costs-a-peer-its-body
category: connections
description: >
  A hostile anti-leech origin: opening another connection does not merely fail to help, it takes
  a peer down. The new socket is accepted normally and a connection already mid-response is cut
  where it stands.
  Every other capped case here punishes the *excess* connection — dropped, answered `429`, queued.
  This one punishes a connection that was already working, so the cost of asking for concurrency
  is paid by work that was already succeeding. The engine has to keep what the cut connection
  delivered and re-request only the rest; treating the victim's grant as lost would waste the
  transfer, and re-issuing the whole grant to a second worker while the first is still fenced is
  the overlapping write I-2 forbids. Finite, at one eviction, because as a standing policy it is
  unsurvivable for any client that opens more than one connection at all.
references: ["docs/agent/INVARIANTS.md#i-2", "docs/agent/INVARIANTS.md#i-7", "docs/01-idm-teardown.md §3.5"]

connections: 3

server:
  content: { size: 6MiB, seed: 156 }
  reset_peers_on_new_connection: 1

expect:
  final_state: completed
  file_renamed: true
  # A peer really was cut mid-body. Without this the case is an ordinary segmented download.
  min_evicted_connections: 1
  # probe, three workers, and the re-request for what the evicted one did not deliver.
  min_requests: 5
