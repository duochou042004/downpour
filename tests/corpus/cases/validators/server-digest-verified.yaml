id: server-digest-verified
category: validators
description: >
  The matching direction, which B-28 recorded as missing. `server-digest-mismatch` proves a wrong
  digest is refused, but a verification step that always failed would pass that case too — the
  two are indistinguishable without this one. The server states the true SHA-256 of the bytes it
  serves, and the download must complete and be renamed.
references: ["RFC 9530", "INVARIANTS.md#i-4", "ADR-0017"]

server:
  content: { size: 64KiB, seed: 22 }
  digest: computed

expect:
  final_state: completed
  file_renamed: true
