id: an-unquoted-etag-is-not-strong
category: validators
description: >
  `ETag: abc123` without quotes is malformed under RFC 9110 §8.8.3, which requires an
  entity-tag to be a quoted-string. A parser that accepted it would treat a malformed header as a
  strong validator and resume against it — and a server sloppy enough to omit the quotes is not
  one whose validator semantics should be trusted. With no usable validator and no Last-Modified,
  the transfer restarts rather than resuming.
references: ["RFC 9110 §8.8.3", "INVARIANTS.md#i-3"]

server:
  content: { size: 64KiB, seed: 26 }
  etag: "abc123"
  transient_body_failures: 1

expect:
  final_state: completed
  file_renamed: true
  forbids_if_range: true
