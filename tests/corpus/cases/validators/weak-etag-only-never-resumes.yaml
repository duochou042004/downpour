id: weak-etag-only-never-resumes
category: validators
description: >
  The only validator offered is a weak ETag. RFC 9110 §8.8.1 permits a weak validator to compare
  equal across representations that differ byte for byte, which is precisely the condition that
  splices two versions together — so it is not usable for `If-Range` and the engine must not
  resume against it. Restarting from byte zero is slower and correct; resuming would be faster
  and occasionally wrong.
references: ["RFC 9110 §8.8.1", "RFC 9110 §13.1.5", "INVARIANTS.md#i-3"]

server:
  content: { size: 64KiB, seed: 13 }
  etag: 'W/"weak"'
  transient_body_failures: 1

expect:
  final_state: completed
  file_renamed: true
  forbids_if_range: true
