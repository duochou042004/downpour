id: content-encoding-identity-uppercase
category: framing
description: >
  `Content-Encoding: IDENTITY` must be ACCEPTED. Field values for content codings are
  case-insensitive, so a case-sensitive comparison against "identity" would refuse a conforming
  server and make the file undownloadable. This is the accept-side case that proves the folding —
  the reject-side cases cannot, because a stricter check rejects them too.
references: ["RFC 9110 §8.4.1", "RFC 9110 §5.6.2", "INVARIANTS.md#i-5"]

server:
  content: { size: 64KiB, seed: 88 }
  content_encoding: IDENTITY

expect:
  final_state: completed
  file_renamed: true
  range_support: proven
