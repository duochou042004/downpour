id: content-encoding-identity-is-fine
category: framing
description: >
  `Content-Encoding: identity` is the conformant answer to `Accept-Encoding: identity` and must NOT
  be treated as a pathology. A rejection that keyed off the header being present at all, rather
  than off its value, would refuse perfectly good servers.
references: ["RFC 9110 §8.4.1", "INVARIANTS.md#i-5"]

server:
  content: { size: 64KiB, seed: 32 }
  content_encoding: identity

expect:
  final_state: completed
  file_renamed: true
  range_support: proven
