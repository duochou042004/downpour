id: content-encoding-identity-padded
category: framing
description: >
  `Content-Encoding: "  identity  "` must be ACCEPTED. Optional whitespace around a field value is
  not part of it, so an untrimmed comparison would treat this as a foreign encoding and refuse a
  conforming server. The accept-side counterpart to `content-encoding-padded`.
references: ["RFC 9110 §5.5", "INVARIANTS.md#i-5"]

server:
  content: { size: 64KiB, seed: 89 }
  content_encoding: "  identity  "

expect:
  final_state: completed
  file_renamed: true
  range_support: proven
