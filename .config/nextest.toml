# cargo-nextest configuration.
#
# Profiles referenced elsewhere:
#   default  — local runs and `just gate`
#   ci       — .gitlab-ci.yml `unit`, `corpus` and `simulation` jobs (needs the JUnit report)

[profile.default]
# Run every test and report all failures. Stopping at the first one hides how much is broken,
# which is exactly the information needed to decide whether to fix or to revert.
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# A test that only passes on a retry is a bug in the test or in the code, not a "known flake"
# (docs/09-testing-strategy.md §7). No retries, so flakiness cannot be absorbed silently.
retries = 0
status-level = "skip"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
