# Pinned so every contributor, every agent, and CI build with the same compiler.
# Raising this is a deliberate act, not a side effect — see .claude/rules/rust.md.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
profile = "minimal"
