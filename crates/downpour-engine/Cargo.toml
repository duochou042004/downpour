[package]
name = "downpour-engine"
description = "Download scheduling, segment allocation, and worker supervision for Downpour."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
downpour-http = { workspace = true }
downpour-intervals = { workspace = true }
downpour-storage = { workspace = true }
downpour-types = { workspace = true }
thiserror = { workspace = true }
# `macros` is for tokio::select! in the worker pool. It was previously reached only through
# workspace feature unification, so `cargo build -p downpour-engine` did not compile on its own.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
downpour-corpus = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
