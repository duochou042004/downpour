[package]
name = "downpour-daemon"
description = "downpourd: the daemon that owns all transfer state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "downpourd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
downpour-engine = { workspace = true }
downpour-http = { workspace = true }
downpour-ipc = { workspace = true }
downpour-storage = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url = { workspace = true }

[dev-dependencies]
downpour-intervals = { workspace = true }
downpour-types = { workspace = true }

[lints]
workspace = true
